<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift Demo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .box {
      margin: 80px 20px;
      padding: 30px;
      border-radius: 20px;
      background: #222;
    }

    .gift {
      font-size: 70px;
      animation: bounce 1s infinite;
    }

    .demo {
      color: #ffd700;
      font-weight: bold;
      font-size: 18px;
    }

    button {
      padding: 14px 28px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    @keyframes bounce {
      50% { transform: translateY(-15px); }
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="gift">🎁</div>

    <h1>Gift Demo</h1>

    <p class="demo">DEMO — Not a real TikTok Gift</p>

    <p id="message">Tap the button to show a demo gift.</p>

    <button onclick="showGift()">Send Demo Gift</button>
  </div>

  <script>
    function showGift() {
      document.getElementById("message").innerText =
        "🎁 Demo Gift Sent! (Test Only)";
    }
  </script>

</body>
  </html>
